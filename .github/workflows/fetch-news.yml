name: Fetch Breaking News (Exa)

on:
  schedule:
    # Every 6 hours at :15 past the hour
    - cron: '15 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Exa news fetcher
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SUPABASE_URL: 'https://hivvemtveyjexrwgruhs.supabase.co'
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-news-exa.mjs

      - name: Commit and push updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/breaking-news.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update breaking news [automated]"
          git push
