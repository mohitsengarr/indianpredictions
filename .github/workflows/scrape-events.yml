name: Daily Firecrawl Scrape

on:
  schedule:
    # Runs daily at 00:30 UTC (6:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Serialize with the news fetcher — both commit to main; overlapping runs
# race on push and one run's data gets lost to a non-fast-forward rejection.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Required for the optional Supabase upsert inside the scraper —
      # without dependencies the dynamic import('@supabase/supabase-js')
      # throws and the DB silently serves stale data forever.
      - name: Install dependencies
        run: npm ci

      - name: Run Firecrawl scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: 'https://gcmugkbvfizcnkrhwjzz.supabase.co'
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/scrape-firecrawl.mjs

      - name: Regenerate weekly digest from current events
        run: node scripts/generate-digest.mjs

      - name: Regenerate sitemap from current events
        run: node scripts/generate-sitemap.mjs

      - name: Commit and push updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/scraped-events.json public/sitemap.xml src/data/digest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update scraped events + sitemap [automated]"
          # Rebase before push in case another workflow/dev pushed meanwhile
          git pull --rebase origin main
          git push

      - name: Ping IndexNow (Bing/Yandex) with refreshed URLs
        run: node scripts/ping-indexnow.mjs
